name: Produção

# ÚNICA porta de entrada para a PRODUÇÃO: só roda quando alguém dispara (Actions > Produção > Run workflow), na main.
# Regra de ouro: a produção fica sempre atrás da homologação. Só vai para a produção o commit que a homologação já está
# rodando, que passou nos testes e que é a ponta da main, com o MESMO pacote que a homologação recebeu.
# Os segredos PROD_* existem só no environment "producao" (com revisor obrigatório); nenhum outro workflow os enxerga.
# Veja docs/operacao/ci-cd.md.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão da release, no formato vX.Y.Z (ex.: v1.0.0)'
        required: true
        type: string
      modo:
        description: 'codigo = só tema e mu-plugins (não mexe no conteúdo); completo = código + banco + fotos (só na carga inicial)'
        required: true
        type: choice
        options: [codigo, completo]
        default: codigo
      abertura:
        description: 'Só no modo completo: fechado = ensaio (visitantes veem "em preparação") | no-ar = lança e libera para o Google'
        required: true
        type: choice
        options: [fechado, no-ar]
        default: fechado
      confirmacao:
        description: 'Digite PRODUCAO (modo codigo) ou CARGA-INICIAL (modo completo: substitui o conteúdo da produção)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  trava-hml:
    name: Trava (a homologação tem de estar neste commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Só para ler o ieadc_deploy da homologação por SSH (usa os segredos HML_*; nada da produção entra aqui).
    environment: homologacao
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.hml.outputs.sha }}
      run_hml: ${{ steps.hml.outputs.run_hml }}
      pacote: ${{ steps.hml.outputs.pacote }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSAO: ${{ inputs.versao }}
      MODO: ${{ inputs.modo }}
      CONFIRMACAO: ${{ inputs.confirmacao }}
    steps:
      - name: Conferir as entradas
        run: |
          set -euo pipefail
          [[ "$VERSAO" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::A versão deve ter o formato vX.Y.Z (ex.: v1.0.0)."; exit 1; }
          case "$MODO" in
            codigo)   certa=PRODUCAO ;;
            completo) certa=CARGA-INICIAL ;;
            *) echo "::error::Modo inválido."; exit 1 ;;
          esac
          [ "$CONFIRMACAO" = "$certa" ] || { echo "::error::Confirmação errada: no modo $MODO digite $certa."; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::A produção só recebe a main. Rode este workflow na branch main."; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: O commit é a ponta da main, passou nos testes e a versão é nova
        run: |
          set -euo pipefail
          ponta="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [ "$ponta" = "$GITHUB_SHA" ] || { echo "::error::A main já avançou ($ponta). Dispare de novo para lançar o commit mais novo, depois que a homologação o receber."; exit 1; }
          verdes="$(gh run list -R "$GITHUB_REPOSITORY" -w Testes -c "$GITHUB_SHA" -b main -e push -s success --json databaseId --jq length)"
          [ "$verdes" -ge 1 ] || { echo "::error::O workflow Testes não passou no commit $GITHUB_SHA."; exit 1; }
          existe="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSAO" --jq "[.[] | select(.ref == \"refs/tags/$VERSAO\")] | length")"
          [ "$existe" -eq 0 ] || { echo "::error::A tag $VERSAO já existe. Escolha uma versão nova (se uma tentativa anterior foi recusada, apague a release e a tag dela)."; exit 1; }

      - name: Preparar a chave SSH da homologação
        env:
          CHAVE: ${{ secrets.HML_SSH_CHAVE }}
        run: |
          umask 077
          printf '%s\n' "$CHAVE" | tr -d '\r' > "$RUNNER_TEMP/chave-hml"
          echo "ALVO_CHAVE=$RUNNER_TEMP/chave-hml" >> "$GITHUB_ENV"

      - name: A homologação roda exatamente este commit, com pacote guardado
        id: hml
        env:
          ALVO_SERVIDOR: ${{ secrets.HML_SERVIDOR }}
          ALVO_PORTA: ${{ secrets.HML_PORTA }}
          ALVO_USUARIO: ${{ secrets.HML_USUARIO }}
          ALVO_URL: ${{ secrets.HML_URL }}
          ALVO_IMPRESSAO: ${{ secrets.HML_IMPRESSAO }}
          ALVO_DESTINO: ${{ secrets.HML_DESTINO }}
        run: |
          set -euo pipefail
          json="$(./bin/implantar.sh ler-deploy)"
          echo "$json" | jq -e . > /dev/null || { echo "::error::Não consegui ler a opção ieadc_deploy da homologação (ela já recebeu alguma implantação?)."; exit 1; }
          sha_hml="$(jq -r '.sha // empty' <<< "$json")"
          amb_hml="$(jq -r '.ambiente // empty' <<< "$json")"
          run_hml="$(jq -r '.run_id // empty' <<< "$json")"
          pacote="$(jq -r '.pacote // empty' <<< "$json")"
          [ "$amb_hml" = homologacao ] || { echo "::error::A opção ieadc_deploy da homologação não é de um ambiente de homologação."; exit 1; }
          [ "$sha_hml" = "$GITHUB_SHA" ] || { echo "::error::A homologação está no commit ${sha_hml:-desconhecido}, não em $GITHUB_SHA. Espere o workflow Homologação terminar neste commit e dispare de novo."; exit 1; }
          [[ "$run_hml" =~ ^[0-9]+$ ]] && [[ "$pacote" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::A implantação da homologação não registrou o run e o pacote."; exit 1; }
          # O pacote que a homologação recebeu tem de existir como artifact DAQUELA execução (e não ter expirado).
          achou="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_hml/artifacts" | jq -r --arg n "pacote-hml-$GITHUB_SHA" '[.artifacts[] | select(.name == $n and (.expired | not))] | length')"
          [ "$achou" -ge 1 ] || { echo "::error::Não há artifact pacote-hml-$GITHUB_SHA válido na execução $run_hml da homologação (expirou?). Rode o workflow Homologação de novo."; exit 1; }
          {
            echo "sha=$GITHUB_SHA"
            echo "run_hml=$run_hml"
            echo "pacote=$pacote"
          } >> "$GITHUB_OUTPUT"
          echo "Trava liberada: homologação no commit ${GITHUB_SHA:0:7}, execução $run_hml, pacote ${pacote:0:12}."

      - name: Apagar a chave SSH
        if: always()
        run: rm -f "$RUNNER_TEMP/chave-hml"

  release:
    name: Criar a release com o pacote da homologação
    needs: trava-hml
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSAO: ${{ inputs.versao }}
      SHA: ${{ needs.trava-hml.outputs.sha }}
      RUN_HML: ${{ needs.trava-hml.outputs.run_hml }}
      PACOTE_HASH: ${{ needs.trava-hml.outputs.pacote }}
    steps:
      - name: Baixar o pacote da homologação
        run: |
          set -euo pipefail
          gh run download "$RUN_HML" -R "$GITHUB_REPOSITORY" -n "pacote-hml-$SHA" -D pacote
          arq="$(find pacote -name 'ieadc-*.tgz' | head -n 1)"
          [ -n "$arq" ] || { echo "::error::O artifact não trouxe o pacote."; exit 1; }
          [ "$(sha256sum "$arq" | cut -d' ' -f1)" = "$PACOTE_HASH" ] || { echo "::error::O pacote guardado não é o que a homologação recebeu (o hash não bate)."; exit 1; }
          [ "$arq" = "pacote/ieadc-$SHA.tgz" ] || mv "$arq" "pacote/ieadc-$SHA.tgz"

      # Nasce como pré-lançamento: só vira release comum depois que a produção receber o pacote (job "producao").
      - name: Criar a release
        run: |
          set -euo pipefail
          gh release create "$VERSAO" "pacote/ieadc-$SHA.tgz" \
            -R "$GITHUB_REPOSITORY" --target "$SHA" --title "Site $VERSAO" --prerelease --generate-notes \
            --notes "Pacote validado na homologação (commit \`${SHA:0:7}\`), com os testes verdes. O anexo é o mesmo arquivo que a homologação recebeu."

  producao:
    name: Implantar na produção
    needs: [trava-hml, release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Revisor obrigatório e só a main: configure no GitHub (docs/operacao/ci-cd.md). Os segredos PROD_* vivem só aqui.
    environment: producao
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSAO: ${{ inputs.versao }}
      SHA: ${{ needs.trava-hml.outputs.sha }}
      PACOTE_HASH: ${{ needs.trava-hml.outputs.pacote }}
      CARGA_ESCOLHIDA: ${{ inputs.modo }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trava-hml.outputs.sha }}
          persist-credentials: false

      - name: Baixar o pacote da release
        run: |
          set -euo pipefail
          gh release download "$VERSAO" -R "$GITHUB_REPOSITORY" -p "ieadc-$SHA.tgz" -D pacote
          [ "$(sha256sum "pacote/ieadc-$SHA.tgz" | cut -d' ' -f1)" = "$PACOTE_HASH" ] || { echo "::error::O pacote da release não é o que a homologação recebeu (o hash não bate)."; exit 1; }

      - name: Preparar a chave SSH da produção
        env:
          CHAVE: ${{ secrets.PROD_SSH_CHAVE }}
        run: |
          umask 077
          printf '%s\n' "$CHAVE" | tr -d '\r' > "$RUNNER_TEMP/chave-prod"
          echo "ALVO_CHAVE=$RUNNER_TEMP/chave-prod" >> "$GITHUB_ENV"

      - name: Enviar, registrar a implantação e rodar a fumaça
        env:
          ALVO_SERVIDOR: ${{ secrets.PROD_SERVIDOR }}
          ALVO_PORTA: ${{ secrets.PROD_PORTA }}
          ALVO_USUARIO: ${{ secrets.PROD_USUARIO }}
          ALVO_URL: ${{ secrets.PROD_URL || 'https://ieadcvilaipiranga.com.br' }}
          ALVO_IMPRESSAO: ${{ secrets.PROD_IMPRESSAO }}
          ALVO_DESTINO: ${{ secrets.PROD_DESTINO }}
          ALVO_EMAIL_ADMIN: ${{ secrets.PROD_EMAIL_ADMIN }}
          CARGA: ${{ inputs.modo }}
          MODO: ${{ inputs.modo == 'completo' && (inputs.abertura == 'no-ar' && 'lancar' || 'ensaio') || '' }}
          AMBIENTE: producao
          CONFIRMACAO: ${{ inputs.confirmacao }}
          DEPLOY_SHA: ${{ needs.trava-hml.outputs.sha }}
          DEPLOY_VERSAO: ${{ inputs.versao }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: ./bin/implantar.sh enviar "pacote/ieadc-$DEPLOY_SHA.tgz"

      - name: Publicar a release (deixa de ser pré-lançamento)
        run: gh release edit "$VERSAO" -R "$GITHUB_REPOSITORY" --prerelease=false --latest

      - name: Resumo
        run: |
          {
            echo "### Produção atualizada: $VERSAO"
            echo "- Commit: \`${SHA:0:7}\` (o mesmo da homologação)"
            echo "- Carga: $CARGA_ESCOLHIDA"
            echo "- O pacote está anexado à release $VERSAO."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar a chave SSH
        if: always()
        run: rm -f "$RUNNER_TEMP/chave-prod"
